<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#08111b"/><text x="70" y="75" fill="#fff" font-family="Arial" font-size="28" font-weight="700">ATOM / LIVE INTERACTION</text><text x="70" y="112" fill="#6ee7ff" font-family="Arial" font-size="16">tehtävä käynnissä • 68%</text><rect x="70" y="165" width="860" height="520" rx="28" fill="#0b1823" stroke="#17384a"/><text x="110" y="225" fill="#91aaba" font-family="Arial" font-size="15">SINÄ</text><text x="110" y="265" fill="#fff" font-family="Arial" font-size="22">Selvitä vaihtoehdot ja kokoa minulle päätösehdotus.</text><text x="110" y="345" fill="#6ee7ff" font-family="Arial" font-size="15">ATOM</text><text x="110" y="385" fill="#e8f4fa" font-family="Arial" font-size="20">Haen lähteitä, vertailen vaihtoehtoja ja kokoan tulosta.</text><text x="110" y="450" fill="#8da8b8" font-family="Arial" font-size="16">Kuuntelen  ✓    Suunnittelen  ✓    Haen tietoa  ✓</text><text x="110" y="490" fill="#6ee7ff" font-family="Arial" font-size="16">Analysoin  ●    Kokoan  ○    Valmis  ○</text><rect x="110" y="560" width="770" height="74" rx="37" fill="#0e2634" stroke="#49ddff"/><text x="145" y="605" fill="#a9c1ce" font-family="Arial" font-size="18">Kysy tai muuta tehtävää kesken työn…</text><circle cx="1140" cy="350" r="135" fill="none" stroke="#49ddff" stroke-width="8"/><circle cx="1140" cy="350" r="110" fill="none" stroke="#ff9b42" stroke-width="3" stroke-dasharray="16 12"/><text x="1080" y="360" fill="#fff" font-family="Arial" font-size="30" font-weight="700">LIVE</text><text x="1030" y="535" fill="#fff" font-family="Arial" font-size="18">Näkyvä työn tila</text><text x="1010" y="575" fill="#8da8b8" font-family="Arial" font-size="15">Selain • tiedostot • muisti</text><text x="1010" y="605" fill="#8da8b8" font-family="Arial" font-size="15">tulokset • hyväksynnät</text></svg>