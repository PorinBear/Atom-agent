<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Adult dashboard concept v2</title>
  <desc id="desc">A second refined adult dashboard concept with a darker control-center layout and operational cards.</desc>
  <defs>
    <linearGradient id="bgAdult2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1626"/>
      <stop offset="100%" stop-color="#1b2b3f"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2e47"/>
      <stop offset="100%" stop-color="#132338"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#08131d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="url(#bgAdult2)"/>
  <rect x="0" y="0" width="230" height="900" fill="#0c1726"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="38" y="165" width="154" height="46" rx="14" fill="#1b2f4b"/>
    <text x="115" y="195" text-anchor="middle" fill="#e7f0ff">Overview</text>
    <rect x="38" y="225" width="154" height="46" rx="14" fill="#162b3e"/>
    <text x="115" y="255" text-anchor="middle" fill="#c4d6f0">Tasks</text>
    <rect x="38" y="285" width="154" height="46" rx="14" fill="#162b3e"/>
    <text x="115" y="315" text-anchor="middle" fill="#c4d6f0">Reports</text>
    <rect x="38" y="345" width="154" height="46" rx="14" fill="#162b3e"/>
    <text x="115" y="375" text-anchor="middle" fill="#c4d6f0">Agents</text>
  </g>

  <rect x="280" y="50" width="1040" height="780" rx="28" fill="#102132" filter="url(#shadow2)"/>
  <text x="320" y="110" font-size="34" font-weight="700" fill="#edf6ff" font-family="Segoe UI, Arial, sans-serif">Operations center</text>
  <text x="320" y="142" font-size="15" fill="#96aac6" font-family="Segoe UI, Arial, sans-serif">Adult view • Theme B</text>

  <g>
    <rect x="320" y="180" width="240" height="125" rx="20" fill="url(#panelGrad)"/>
    <text x="350" y="220" font-size="12" fill="#aec4dc" font-family="Segoe UI, Arial, sans-serif">System health</text>
    <text x="350" y="265" font-size="38" font-weight="700" fill="#f4f9ff" font-family="Segoe UI, Arial, sans-serif">99.8%</text>
    <circle cx="485" cy="244" r="32" fill="none" stroke="#7ad7ff" stroke-width="10" stroke-dasharray="150 85" transform="rotate(-90 485 244)"/>

    <rect x="590" y="180" width="240" height="125" rx="20" fill="url(#panelGrad)"/>
    <text x="620" y="220" font-size="12" fill="#aec4dc" font-family="Segoe UI, Arial, sans-serif">Queue</text>
    <text x="620" y="265" font-size="38" font-weight="700" fill="#f4f9ff" font-family="Segoe UI, Arial, sans-serif">1,482</text>
    <rect x="740" y="208" width="42" height="38" rx="10" fill="#45d9b7"/>

    <rect x="860" y="180" width="240" height="125" rx="20" fill="url(#panelGrad)"/>
    <text x="890" y="220" font-size="12" fill="#aec4dc" font-family="Segoe UI, Arial, sans-serif">Agents online</text>
    <text x="890" y="265" font-size="38" font-weight="700" fill="#f4f9ff" font-family="Segoe UI, Arial, sans-serif">18</text>
    <circle cx="1005" cy="245" r="24" fill="#61d0ff"/>
    <circle cx="1058" cy="245" r="24" fill="#7ee9d2"/>
  </g>

  <g>
    <rect x="320" y="340" width="780" height="320" rx="22" fill="#152d45"/>
    <text x="350" y="382" font-size="24" font-weight="700" fill="#edf6ff" font-family="Segoe UI, Arial, sans-serif">Recent activity</text>

    <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#dfeafc">
      <rect x="350" y="408" width="710" height="42" rx="10" fill="#1c3659"/>
      <text x="372" y="435">Task #1248</text>
      <text x="545" y="435">Completed</text>
      <text x="640" y="435">2m ago</text>
      <rect x="785" y="417" width="120" height="18" rx="9" fill="#57d0ff"/>

      <rect x="350" y="462" width="710" height="42" rx="10" fill="#1c3659"/>
      <text x="372" y="489">Task #1247</text>
      <text x="545" y="489">Reviewing</text>
      <text x="640" y="489">8m ago</text>
      <rect x="785" y="471" width="92" height="18" rx="9" fill="#f8c96c"/>

      <rect x="350" y="516" width="710" height="42" rx="10" fill="#1c3659"/>
      <text x="372" y="543">Task #1246</text>
      <text x="545" y="543">Blocked</text>
      <text x="640" y="543">11m ago</text>
      <rect x="785" y="525" width="80" height="18" rx="9" fill="#ff8b7d"/>

      <rect x="350" y="570" width="710" height="42" rx="10" fill="#1c3659"/>
      <text x="372" y="597">Task #1245</text>
      <text x="545" y="597">Approved</text>
      <text x="640" y="597">18m ago</text>
      <rect x="785" y="579" width="135" height="18" rx="9" fill="#42d6a9"/>
    </g>
  </g>
</svg>


