<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Adult dashboard concept v1</title>
  <desc id="desc">A refined but still early-version adult dashboard mockup with a modern dark theme, summary cards, chart, and activity list.</desc>
  <defs>
    <linearGradient id="bgAdult" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#15273f"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2d46"/>
      <stop offset="100%" stop-color="#122235"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#040c16" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="url(#bgAdult)"/>

  <rect x="0" y="0" width="230" height="900" fill="#0f1a2a"/>
  <circle cx="115" cy="70" r="28" fill="#63d5ff"/>
  <text x="115" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#edf6ff">ATOM</text>

  <g fill="#dbeafc" font-family="Segoe UI, Arial, sans-serif" font-size="16">
    <rect x="38" y="165" width="154" height="44" rx="12" fill="#1b2d48"/>
    <text x="115" y="194" text-anchor="middle">Overview</text>
    <rect x="38" y="225" width="154" height="44" rx="12" fill="#162a3f"/>
    <text x="115" y="254" text-anchor="middle" fill="#b9cce8">Tasks</text>
    <rect x="38" y="285" width="154" height="44" rx="12" fill="#162a3f"/>
    <text x="115" y="314" text-anchor="middle" fill="#b9cce8">Reports</text>
    <rect x="38" y="345" width="154" height="44" rx="12" fill="#162a3f"/>
    <text x="115" y="374" text-anchor="middle" fill="#b9cce8">Agents</text>
    <rect x="38" y="405" width="154" height="44" rx="12" fill="#162a3f"/>
    <text x="115" y="434" text-anchor="middle" fill="#b9cce8">Settings</text>
  </g>

  <rect x="270" y="50" width="1060" height="780" rx="28" fill="#102235" opacity="0.9" filter="url(#shadow)"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="310" y="110" font-size="34" font-weight="700" fill="#edf6ff">Management dashboard</text>
    <text x="310" y="140" font-size="14" fill="#91a8c2">Adult view • Theme A</text>
  </g>

  <g>
    <rect x="310" y="180" width="210" height="125" rx="18" fill="url(#cardGrad)"/>
    <text x="340" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a3bddb">Active tasks</text>
    <text x="340" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#f9fbff">128</text>
    <rect x="440" y="208" width="18" height="52" rx="9" fill="#5ad0ff"/>
    <rect x="465" y="192" width="18" height="68" rx="9" fill="#83dcff"/>
    <rect x="490" y="220" width="18" height="40" rx="9" fill="#57c3ea"/>

    <rect x="545" y="180" width="210" height="125" rx="18" fill="url(#cardGrad)"/>
    <text x="575" y="220" font-size="12" fill="#a3bddb" font-family="Segoe UI, Arial, sans-serif">Completed</text>
    <text x="575" y="260" font-size="38" font-weight="700" fill="#f9fbff" font-family="Segoe UI, Arial, sans-serif">94%</text>
    <circle cx="675" cy="241" r="28" fill="none" stroke="#5ad0ff" stroke-width="8" stroke-dasharray="95 60" transform="rotate(-90 675 241)"/>

    <rect x="780" y="180" width="210" height="125" rx="18" fill="url(#cardGrad)"/>
    <text x="810" y="220" font-size="12" fill="#a3bddb" font-family="Segoe UI, Arial, sans-serif">Alerts</text>
    <text x="810" y="260" font-size="38" font-weight="700" fill="#f9fbff" font-family="Segoe UI, Arial, sans-serif">12</text>
    <rect x="900" y="204" width="22" height="38" rx="8" fill="#ffca66"/>
    <rect x="930" y="214" width="22" height="28" rx="8" fill="#ff8f7a"/>
  </g>

  <g>
    <rect x="310" y="340" width="610" height="285" rx="22" fill="#152d45"/>
    <text x="336" y="382" font-size="24" font-weight="700" fill="#edf6ff" font-family="Segoe UI, Arial, sans-serif">Performance</text>
    <g opacity="0.97">
      <rect x="340" y="468" width="48" height="90" rx="10" fill="#63d5ff"/>
      <rect x="402" y="438" width="48" height="120" rx="10" fill="#7ce5d4"/>
      <rect x="464" y="410" width="48" height="148" rx="10" fill="#63d5ff"/>
      <rect x="526" y="460" width="48" height="98" rx="10" fill="#8ec7ff"/>
      <rect x="588" y="432" width="48" height="126" rx="10" fill="#7ce5d4"/>
      <rect x="650" y="390" width="48" height="168" rx="10" fill="#63d5ff"/>
      <rect x="712" y="430" width="48" height="128" rx="10" fill="#8ec7ff"/>
    </g>
    <line x1="340" y1="555" x2="770" y2="555" stroke="#35557e" stroke-width="2"/>
  </g>

  <g>
    <rect x="955" y="340" width="310" height="285" rx="22" fill="#152d45"/>
    <text x="985" y="382" font-size="24" font-weight="700" fill="#edf6ff" font-family="Segoe UI, Arial, sans-serif">Activity</text>
    <g fill="#cfe1f9" font-family="Segoe UI, Arial, sans-serif" font-size="15">
      <rect x="985" y="412" width="235" height="16" rx="8" fill="#1c3555"/>
      <rect x="985" y="445" width="200" height="16" rx="8" fill="#1c3555"/>
      <rect x="985" y="478" width="220" height="16" rx="8" fill="#1c3555"/>
      <rect x="985" y="511" width="180" height="16" rx="8" fill="#1c3555"/>
      <circle cx="1200" cy="420" r="7" fill="#63d5ff"/>
      <circle cx="1200" cy="453" r="7" fill="#7ce5d4"/>
      <circle cx="1200" cy="486" r="7" fill="#ffca66"/>
      <circle cx="1200" cy="519" r="7" fill="#ff8f7a"/>
    </g>
  </g>
</svg>


